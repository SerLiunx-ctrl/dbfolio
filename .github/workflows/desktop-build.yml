name: Desktop build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
  push:
    branches: [master]
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README*.md'
      - 'LICENSE'
      - 'AGENTS.md'
      - 'updates/README.md'
  pull_request:
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README*.md'
      - 'LICENSE'
      - 'AGENTS.md'
      - 'updates/README.md'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  windows:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'macos' }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build installer and portable package
        run: npm run app:build
      - name: Record build provenance
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $metadata = @{
            version = $version
            target = 'x86_64-pc-windows-msvc'
            commit = $env:GITHUB_SHA
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            profile = 'release'
            windowsCodeSigned = $false
            updaterSigned = $false
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 "release/$version/DBFolio_${version}_windows_x64_build-info.json"
      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DBFolio-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            release/*/*_windows_x64_setup.exe
            release/*/*_windows_x64_portable.zip
            release/*/*_windows_x64_*SHA256SUMS.txt
            release/*/*_windows_x64_build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload startup diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-windows-${{ github.run_number }}-${{ github.run_attempt }}
          path: .qa/startup-*
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and verify macOS packages
        run: npm run app:build:macos -- --target ${{ matrix.target }}
      - name: Check packaged app startup
        run: node scripts/check-app-startup-macos.mjs "src-tauri/target/${{ matrix.target }}/release/bundle/macos/DBFolio.app"
      - name: Upload macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DBFolio-macos-${{ matrix.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            release/*/*_macos_${{ matrix.arch }}_*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload startup diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-macos-${{ matrix.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: .qa/startup-macos-*
          if-no-files-found: ignore
          retention-days: 7
